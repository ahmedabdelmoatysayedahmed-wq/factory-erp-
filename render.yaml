# إعداد الاستضافة على Render (Blueprint)
services:
  - type: web
    name: factory-erp
    runtime: node
    plan: starter            # لازم خطة مدفوعة علشان القرص الدائم اللي بيتحفظ عليه قاعدة البيانات
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_FILE
        value: /var/data/factory.db
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD     # كلمة مرور admin لأول مرة - هتكتبها بنفسك وقت الإعداد
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
